<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova — Administration</title>
<style>
  :root { --accent:#3b82f6; --bg:#0f1115; --card:#1a1d24; --border:#2a2e38; --text:#e5e7eb; --muted:#9ca3af; --danger:#ef4444; --ok:#22c55e; }
  * { box-sizing:border-box; margin:0 }
  body { font-family:-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); padding:24px; }
  h1 { font-size:22px; display:flex; align-items:center; gap:10px }
  .muted { color:var(--muted); font-size:13px }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:20px 0 }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px }
  .card .num { font-size:26px; font-weight:700 }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; font-size:14px }
  th,td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border) }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px }
  tr:hover td { background:#22262f }
  .badge { padding:2px 8px; border-radius:99px; font-size:12px }
  .b-ok { background:#14532d; color:#86efac } .b-off { background:#450a0a; color:#fca5a5 }
  .b-role { background:#1e3a5f; color:#93c5fd }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px }
  button.danger { background:var(--danger) } button.ghost { background:#374151 }
  button:disabled { opacity:.5; cursor:not-allowed }
  input,select,textarea { background:#11141a; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:14px; width:100% }
  .toolbar { display:flex; gap:10px; margin:16px 0; align-items:center }
  .toolbar input { max-width:320px }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50 }
  #modal .box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; width:520px; max-height:85vh; overflow:auto }
  #modal h2 { font-size:18px; margin-bottom:4px; word-break:break-all }
  .row { display:flex; gap:10px; margin-top:12px } .row > * { flex:1 }
  label { font-size:12px; color:var(--muted); display:block; margin-bottom:4px }
  .actions { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap }
  .usage { font-size:12px; color:var(--muted); margin-top:14px; max-height:140px; overflow:auto }
  #login { max-width:360px; margin:15vh auto; background:var(--card); padding:28px; border-radius:16px; border:1px solid var(--border) }
  .toast { position:fixed; bottom:20px; right:20px; padding:12px 16px; border-radius:10px; color:#fff; font-size:13px; z-index:100; max-width:360px; box-shadow:0 10px 30px rgba(0,0,0,.4); animation:slideIn .2s ease }
  .toast.ok { background:var(--ok) } .toast.err { background:var(--danger) }
  @keyframes slideIn { from { transform:translateY(20px); opacity:0 } to { transform:translateY(0); opacity:1 } }
  .empty { padding:24px; text-align:center; color:var(--muted) }
</style>
</head>
<body>

<div id="login">
  <h1>◐ Nova Admin</h1>
  <p class="muted" style="margin:10px 0 14px">Entrez le token administrateur.</p>
  <input id="token" type="password" placeholder="x-admin-token" onkeydown="if(event.key==='Enter')login()">
  <button style="width:100%;margin-top:12px" onclick="login()" id="login-btn">Connexion</button>
  <p class="muted" id="login-err" style="margin-top:8px;color:var(--danger)"></p>
</div>

<div id="panel" style="display:none;max-width:1100px;margin:0 auto">
  <h1>◐ Nova — Administration <span class="muted" id="domains"></span></h1>
  <div class="cards">
    <div class="card"><div class="muted">Sièges utilisés</div><div class="num" id="seats">–</div></div>
    <div class="card"><div class="muted">Utilisateurs actifs aujourd'hui</div><div class="num" id="active-today">–</div></div>
    <div class="card"><div class="muted">Transcriptions aujourd'hui</div><div class="num" id="tr-today">–</div></div>
    <div class="card"><div class="muted">Reformulations aujourd'hui</div><div class="num" id="rf-today">–</div></div>
  </div>
  <div class="toolbar">
    <input id="search" placeholder="Rechercher par email, cohorte, rôle…" oninput="render()">
    <button class="ghost" onclick="load()" id="refresh-btn">↻ Actualiser</button>
  </div>
  <table>
    <thead><tr>
      <th>Email</th><th>Rôle</th><th>Cohorte</th><th>Appareils</th>
      <th>Dictées</th><th>Reformul.</th><th>Dernière activité</th><th>Statut</th><th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="modal"><div class="box">
  <h2 id="m-email"></h2>
  <p class="muted" id="m-meta"></p>
  <div class="row">
    <div><label>Rôle</label>
      <select id="m-role"><option value="student">student</option><option value="teacher">teacher</option>
      <option value="staff">staff</option><option value="partner">partner</option></select></div>
    <div><label>Cohorte</label><input id="m-cohort" placeholder="Promo 2028"></div>
  </div>
  <div style="margin-top:12px"><label>Note admin</label><textarea id="m-note" rows="2"></textarea></div>
  <div class="usage" id="m-usage"></div>
  <div class="actions">
    <button onclick="save()" id="m-save">💾 Enregistrer</button>
    <button class="ghost" id="m-suspend-btn" onclick="toggleSuspend()"></button>
    <button class="ghost" onclick="revokeMachines()">Déconnecter les appareils</button>
    <button class="danger" onclick="del()">Supprimer</button>
    <button class="ghost" onclick="closeModal()">Fermer</button>
  </div>
</div></div>

<script>
let TOKEN = localStorage.nova_admin_token || "", DATA = null, CURRENT = null;
const $ = id => document.getElementById(id);
const fmt = ts => {
  const n = Number(ts);
  return n ? new Date(n*1000).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}) : "—";
};

if (TOKEN) { $("token").value = TOKEN; login(); }

function toast(msg, ok=true) {
  const el = document.createElement("div");
  el.className = "toast " + (ok ? "ok" : "err");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

async function api(path, opts={}) {
  const headers = {"x-admin-token": TOKEN};
  if (opts.body) headers["Content-Type"] = "application/json";
  let r;
  try {
    r = await fetch(path, {...opts, headers});
  } catch (e) {
    throw new Error("Impossible de joindre le serveur");
  }
  if (r.status === 403) throw new Error("Token invalide");
  let data;
  try { data = await r.json(); } catch { data = null; }
  if (!r.ok) throw new Error(data?.detail || `Erreur ${r.status}`);
  return data;
}

async function login() {
  TOKEN = $("token").value.trim();
  $("login-err").textContent = "";
  $("login-btn").disabled = true;
  try {
    await api("/api/admin/overview");
  } catch (e) {
    $("login-err").textContent = e.message || "Token invalide";
    $("login-btn").disabled = false;
    return;
  }
  localStorage.nova_admin_token = TOKEN;
  $("login").style.display = "none"; $("panel").style.display = "block";
  load();
}

async function load() {
  $("refresh-btn").disabled = true;
  try {
    DATA = await api("/api/admin/overview");
    $("domains").textContent = "· " + (DATA.domains || []).join(", ");
    $("seats").textContent = (DATA.seats_used ?? "?") + " / " + (DATA.max_seats ?? "?");
    $("active-today").textContent = DATA.today?.actifs ?? "–";
    $("tr-today").textContent = DATA.today?.t ?? "–";
    $("rf-today").textContent = DATA.today?.r ?? "–";
    render();
  } catch (e) {
    toast(e.message || "Erreur de chargement", false);
  } finally {
    $("refresh-btn").disabled = false;
  }
}

function render() {
  const q = $("search").value.toLowerCase();
  const users = (DATA?.users || []).filter(u => !q || (u.email+u.role+(u.cohort||"")).toLowerCase().includes(q));
  if (!users.length) {
    $("rows").innerHTML = `<tr><td colspan="9" class="empty">Aucun utilisateur</td></tr>`;
    return;
  }
  $("rows").innerHTML = users.map(u => `<tr>
    <td>${escapeHtml(u.email)}${u.note ? ` <span class="muted" title="${escapeHtml(u.note)}">📝</span>` : ""}</td>
    <td><span class="badge b-role">${escapeHtml(u.role)}</span></td>
    <td>${escapeHtml(u.cohort) || "—"}</td>
    <td>${u.machines ?? 0}</td>
    <td>${u.total_transcriptions ?? 0}</td>
    <td>${u.total_reformulations ?? 0}</td>
    <td>${fmt(u.last_seen)}</td>
    <td>${u.disabled ? '<span class="badge b-off">suspendu</span>' : '<span class="badge b-ok">actif</span>'}</td>
    <td><button class="ghost" onclick="openUser('${escapeJs(u.email)}')">Gérer</button></td>
  </tr>`).join("");
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function escapeJs(s) {
  return String(s || "").replace(/[\\'"]/g, "\\$&").replace(/\n/g, "\\n");
}

async function openUser(email) {
  try {
    const d = await api("/api/admin/user/" + encodeURIComponent(email));
    if (!d.profile) throw new Error("Profil introuvable");
    CURRENT = d.profile;
    $("m-email").textContent = email;
    $("m-meta").textContent = `Inscrit le ${fmt(d.profile.created_at)} · ${(d.machines || []).length} appareil(s) : ` +
      (d.machines || []).map(m => `${m.machine}${m.active ? "" : " (révoqué)"}`).join(", ");
    $("m-role").value = d.profile.role || "student";
    $("m-cohort").value = d.profile.cohort || "";
    $("m-note").value = d.profile.note || "";
    $("m-suspend-btn").textContent = d.profile.disabled ? "Réactiver le compte" : "Suspendre le compte";
    $("m-usage").innerHTML = "<b>Usage (30 derniers jours, compteurs uniquement)</b><br>" +
      ((d.usage_30d || []).length ? d.usage_30d.map(h =>
        `${h.day} — ${h.transcriptions} dictées, ${h.reformulations} reformulations`).join("<br>")
        : "Aucune activité");
    $("modal").style.display = "flex";
  } catch (e) {
    toast(e.message, false);
  }
}

function closeModal(){ $("modal").style.display = "none"; CURRENT = null; }

async function save() {
  if (!CURRENT) return;
  $("m-save").disabled = true;
  try {
    await api("/api/admin/user/" + encodeURIComponent(CURRENT.email), {method:"POST",
      body: JSON.stringify({role:$("m-role").value, cohort:$("m-cohort").value, note:$("m-note").value})});
    toast("Modifications enregistrées");
    closeModal(); load();
  } catch (e) {
    toast(e.message, false);
  } finally {
    $("m-save").disabled = false;
  }
}

async function toggleSuspend() {
  if (!CURRENT) return;
  try {
    await api("/api/admin/user/" + encodeURIComponent(CURRENT.email), {method:"POST",
      body: JSON.stringify({disabled: !CURRENT.disabled})});
    toast(CURRENT.disabled ? "Compte réactivé" : "Compte suspendu");
    closeModal(); load();
  } catch (e) {
    toast(e.message, false);
  }
}

async function revokeMachines() {
  if (!CURRENT) return;
  if (!confirm("Déconnecter tous les appareils de " + CURRENT.email + " ?")) return;
  try {
    await api("/api/admin/user/" + encodeURIComponent(CURRENT.email) + "/revoke-machines", {method:"POST"});
    toast("Appareils déconnectés");
    closeModal(); load();
  } catch (e) {
    toast(e.message, false);
  }
}

async function del() {
  if (!CURRENT) return;
  if (!confirm("SUPPRIMER définitivement " + CURRENT.email + " (profil, appareils, compteurs) ?")) return;
  try {
    await api("/api/admin/user/" + encodeURIComponent(CURRENT.email), {method:"DELETE"});
    toast("Utilisateur supprimé");
    closeModal(); load();
  } catch (e) {
    toast(e.message, false);
  }
}
</script>
</body>
</html>
