# Loki en un seul processus, sur disque. Les journaux reçus sont ceux
# d'avertissement et d'erreur, déjà caviardés côté école.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-11-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 90 jours, comme le détail horaire du serveur d'école.
  retention_period: 2160h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
