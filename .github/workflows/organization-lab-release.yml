name: Organization Lab release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version
        required: true
        type: string
      channel:
        description: Release channel published under /server/<channel>
        required: false
        default: quick-lab
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: organization-lab-release
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v7
        with: { context: ., push: true, tags: "ghcr.io/mailpro31/nova-server:${{ inputs.version }}" }

  profiles:
    # La matrice n'est pas ecrite ici : elle est derivee de
    # `profiles.manifest.json`, la seule table qui decrive les paliers
    # materiels. Une liste tenue en double finirait par diverger, et c'est
    # l'installeur qui refuserait un profil absent du manifeste signe.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
      tiers: ${{ steps.derive.outputs.tiers }}
    steps:
      - uses: actions/checkout@v5
      - id: derive
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          profils = json.load(open("tools/organization-lab/profiles.manifest.json", encoding="utf-8"))["profiles"]
          retenus = [p for p in profils if p.get("gpu") and p.get("supported")]
          entrees = [{
              "id": p["id"],
              # `LAB_GPU_24GB_PLUS` -> `24gb-plus` : une etiquette d'image lisible
              # et stable, qui ne depend pas de l'ordre des profils.
              "tier": p["id"].removeprefix("LAB_GPU_").lower().replace("_", "-"),
              "speech_model": p["speech_model"],
              "speech_compute_type": p["speech_compute_type"],
              # Vide pour un palier encore sur faster-whisper.
              "speech_engine": p.get("speech_engine", ""),
              "speech_gguf_url": p.get("speech_gguf_url", ""),
              "speech_gguf_sha256": p.get("speech_gguf_sha256", ""),
              "text_model": p["text_model"],
          } for p in retenus]
          print("matrix=" + json.dumps({"include": entrees}))
          print("tiers=" + json.dumps([e["tier"] for e in entrees]))
          PY
      - run: |
          echo "paliers construits par cette release :"
          echo '${{ steps.derive.outputs.tiers }}'

  speech:
    needs: profiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Reclaim runner space for the model image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # transcribe.cpp (speech-gguf.Dockerfile) quand le profil le demande : le
      # serveur de test transcrit ainsi depuis le 11/10, 0,101 d'erreurs
      # normalisees contre 0,134 pour faster-whisper. Le modele GGUF est verifie
      # par son empreinte pendant la construction. Meme port, meme etiquette :
      # le compose de l'installateur ne change pas.
      - id: build-gguf
        if: matrix.speech_engine == 'transcribe_cpp'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/organization-lab/images/speech-gguf.Dockerfile
          push: true
          build-args: |
            GGUF_URL=${{ matrix.speech_gguf_url }}
            GGUF_SHA256=${{ matrix.speech_gguf_sha256 }}
          tags: ghcr.io/mailpro31/nova-quick-lab-speech:${{ inputs.version }}-${{ matrix.tier }}
      - id: build
        if: matrix.speech_engine != 'transcribe_cpp'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/organization-lab/images/whisper.Dockerfile
          push: true
          build-args: |
            WHISPER_MODEL=${{ matrix.speech_model }}
            WHISPER_COMPUTE_TYPE=${{ matrix.speech_compute_type }}
          tags: ghcr.io/mailpro31/nova-quick-lab-speech:${{ inputs.version }}-${{ matrix.tier }}

  language:
    needs: profiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Reclaim runner space for the model image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/organization-lab/images/llm.Dockerfile
          push: true
          build-args: |
            LLM_MODEL=${{ matrix.text_model }}
          tags: ghcr.io/mailpro31/nova-quick-lab-language:${{ inputs.version }}-${{ matrix.tier }}

  installer:
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & tools/organization-lab/build-installer.ps1
          $exe = 'tools/organization-lab/dist/NovaOrganizationServerSetup.exe'
          if (-not (Test-Path $exe)) { throw 'Installer build produced no executable.' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[a-f0-9]{64}$') { throw 'Installer hash is invalid.' }
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Installer SHA-256: $hash"
      - name: Run the compiled installer in a clean directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The installer requests administrator elevation in its manifest, which
          # hosted Windows runners already satisfy. selftest reads the embedded
          # release key and exits; it touches no network and no install location.
          $resultDir = Join-Path ([IO.Path]::GetTempPath()) 'NovaOrganizationServerSelfTest'
          Remove-Item $resultDir -Recurse -Force -ErrorAction SilentlyContinue
          $clean = Join-Path $env:RUNNER_TEMP ('nova-cleanroom-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $clean | Out-Null
          Copy-Item tools/organization-lab/dist/NovaOrganizationServerSetup.exe (Join-Path $clean 'NovaOrganizationServerSetup.exe')
          Push-Location $clean
          try {
            & .\NovaOrganizationServerSetup.exe selftest | Out-Null
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          $resultFile = Join-Path $resultDir 'selftest-result.txt'
          if (-not (Test-Path $resultFile)) { throw "The installer produced no selftest result at $resultFile (exit $code)." }
          $result = (Get-Content -Raw $resultFile).Trim()
          Write-Output "exit=$code"
          Write-Output $result
          if ($result -match 'RELEASE_PUBLIC_KEY_NOT_CONFIGURED') { throw 'The installer cannot read its embedded release key.' }
          if ($code -ne 0) { throw "Installer selftest failed with exit code $code." }
          if ($result -notmatch 'RELEASE_PUBLIC_KEY_OK bits=3072') { throw 'The installer did not confirm the pinned 3072-bit release key.' }
          if ($result -notmatch 'origin=https://releases\.novaspeak\.app') { throw 'The installer did not report the pinned manifest origin.' }
          # A tool that exits 0 while writing to stderr must not read as failed:
          # docker compose writes its progress there, which is how a running
          # PostgreSQL and a running Whisper were both reported as COMPOSE_FAILED.
          if ($result -notmatch 'COMPOSE_OUTPUT_OK stderr_is_not_failure=1 exit_code_is_read=1') { throw 'The installer still treats stderr as failure.' }
          if ($result -notmatch 'SERVICE_STATE_OK') { throw 'The installer does not classify container states correctly.' }
      - uses: actions/upload-artifact@v6
        with:
          name: organization-lab-${{ inputs.version }}-installer
          path: tools/organization-lab/dist/NovaOrganizationServerSetup.exe
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: [profiles, server, speech, language, installer]
    runs-on: ubuntu-latest
    environment: organization-lab-release
    steps:
      # Le manifeste signé est construit depuis `profiles.manifest.json` : sans
      # le dépôt, la publication échouait au dernier moment (11/10, run
      # 38132465350), après la construction de toutes les images.
      - uses: actions/checkout@v5
      - name: Validate release inputs and secrets
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DIGESTS: ${{ steps.dependencies.outputs.digests }}
          SIGNING_KEY: ${{ secrets.NOVA_RELEASE_SIGNING_KEY_PEM }}
          VERCEL_TOKEN: ${{ secrets.NOVA_RELEASE_VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          # Le canal devient un chemin sur le site publie : rien qui puisse en
          # sortir, ni « .. », ni barre oblique.
          [[ "$CHANNEL" =~ ^[a-z0-9][a-z0-9-]{0,31}$ ]]
          test -n "$SIGNING_KEY"
          test -n "$VERCEL_TOKEN"
      - name: Resolve linux/amd64 manifest digests
        id: dependencies
        env:
          VERSION: ${{ inputs.version }}
          SERVER_INDEX: ${{ needs.server.outputs.digest }}
          TIERS: ${{ needs.profiles.outputs.tiers }}
        run: |
          set -euo pipefail

          PYTHON=$(command -v python3 || command -v python)
          test -n "$PYTHON"

          # Every push produces an OCI index: one linux/amd64 manifest plus a
          # buildx attestation manifest. Pinning the index digest would leave the
          # platform choice to the client and make what docker reports afterwards
          # depend on its image store. The client runs linux containers under
          # WSL2, so the release pins the linux/amd64 manifest directly.
          registry_token() {
            case "$1" in
              ghcr.io) curl -fsS --max-time 30 "https://ghcr.io/token?scope=repository:$2:pull&service=ghcr.io" ;;
              *)       curl -fsS --max-time 30 "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$2:pull" ;;
            esac | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
          }

          registry_host() {
            case "$1" in
              ghcr.io) echo "https://ghcr.io" ;;
              *)       echo "https://registry-1.docker.io" ;;
            esac
          }

          accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'

          # Prints the linux/amd64 manifest digest for a tag or an index digest.
          amd64_digest() {
            registry="$1"; repo="$2"; reference="$3"
            for attempt in 1 2 3 4 5; do
              token=$(registry_token "$registry" "$repo") || token=""
              if [ -n "$token" ]; then
                body=$(mktemp)
                if curl -fsS --max-time 60 -o "$body" -H "Authorization: Bearer $token" -H "Accept: $accept" \
                    "$(registry_host "$registry")/v2/${repo}/manifests/${reference}"; then
                  digest=$("$PYTHON" -c 'import json,sys;d=json.load(open(sys.argv[1],encoding="utf-8"));c=[e["digest"] for e in d.get("manifests",[]) if (e.get("platform") or {}).get("os")=="linux" and (e.get("platform") or {}).get("architecture")=="amd64" and not (e.get("platform") or {}).get("variant")];print(c[0] if c else "")' "$body")
                  rm -f "$body"
                  if [ -n "$digest" ]; then
                    printf '%s' "$digest"
                    return 0
                  fi
                  echo "No linux/amd64 manifest in ${registry}/${repo}@${reference}" >&2
                  return 1
                fi
                rm -f "$body"
              fi
              echo "Manifest fetch failed for ${registry}/${repo}:${reference} (attempt ${attempt})" >&2
              sleep $(( attempt * 5 ))
            done
            echo "PLATFORM_DIGEST_UNRESOLVED: ${registry}/${repo}@${reference}" >&2
            return 1
          }

          emit() {
            name="$1"; value="$2"
            [[ "$value" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "${name}=${value}" >> "$GITHUB_OUTPUT"
            echo "Pinned ${name} ${value}"
          }

          emit postgres "$(amd64_digest docker.io library/postgres 16-alpine)"
          emit redis    "$(amd64_digest docker.io library/redis 7-alpine)"
          emit server   "$(amd64_digest ghcr.io mailpro31/nova-server   "$SERVER_INDEX")"
          # Un couple d'images par palier. Les empreintes sont resolues depuis
          # l'etiquette que la matrice vient de pousser : c'est la vue du
          # registre, pas la sortie d'un job -- une matrice n'expose pas ses
          # sorties palier par palier.
          : > /tmp/digests.json
          {
            printf '{'
            premier=1
            for tier in $(printf '%s' "$TIERS" | python3 -c 'import json,sys;print(" ".join(json.load(sys.stdin)))'); do
              for genre in speech language; do
                image="mailpro31/nova-quick-lab-${genre}"
                digest=$(amd64_digest ghcr.io "$image" "${VERSION}-${tier}")
                [ -z "$digest" ] && { echo "empreinte introuvable : $image:${VERSION}-${tier}" >&2; exit 1; }
                [ $premier -eq 0 ] && printf ','
                printf '"%s-%s":"%s"' "$genre" "$tier" "$digest"
                premier=0
                echo "resolu ${genre}-${tier} -> ${digest}" >&2
              done
            done
            printf '}'
          } > /tmp/digests.json
          echo "digests=$(cat /tmp/digests.json)" >> "$GITHUB_OUTPUT"

      - name: Stage the Windows installer for publication
        uses: actions/download-artifact@v7
        with:
          name: organization-lab-${{ inputs.version }}-installer
          path: release-site/public/server/${{ inputs.channel }}
      - name: Verify the staged installer matches the built hash
        env:
          CHANNEL: ${{ inputs.channel }}
          INSTALLER_SHA256: ${{ needs.installer.outputs.sha256 }}
        run: |
          set -euo pipefail
          exe=release-site/public/server/${CHANNEL}/NovaOrganizationServerSetup.exe
          test -s "$exe"
          actual=$(sha256sum "$exe" | awk '{print $1}')
          test "$actual" = "$INSTALLER_SHA256"
      - name: Generate signed public manifest
        env:
          VERSION: ${{ inputs.version }}
          SERVER_DIGEST: ${{ steps.dependencies.outputs.server }}
          POSTGRES_DIGEST: ${{ steps.dependencies.outputs.postgres }}
          REDIS_DIGEST: ${{ steps.dependencies.outputs.redis }}
          SERVER_INDEX: ${{ needs.server.outputs.digest }}
          INSTALLER_SHA256: ${{ needs.installer.outputs.sha256 }}
          CHANNEL: ${{ inputs.channel }}
          DIGESTS: ${{ steps.dependencies.outputs.digests }}
          SIGNING_KEY: ${{ secrets.NOVA_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          mkdir -p "release-site/public/server/${CHANNEL}"
          python3 - <<'PY'
          import json, os

          version = os.environ['VERSION']
          channel = os.environ['CHANNEL']
          digests = json.loads(os.environ['DIGESTS'])
          paliers = json.load(open('tools/organization-lab/profiles.manifest.json',
                                   encoding='utf-8'))['profiles']
          paliers = [p for p in paliers if p.get('gpu') and p.get('supported')]

          def tier(identifiant):
              return identifiant.removeprefix('LAB_GPU_').lower().replace('_', '-')

          # Les images communes, identiques a tous les paliers.
          artifacts = [
            {'id': 'nova-server', 'kind': 'oci_image',
             'image': f'ghcr.io/mailpro31/nova-server@{os.environ["SERVER_DIGEST"]}',
             'local_image': f'nova-local/server:{version}',
             'license': 'Proprietary-Nova', 'platform': 'linux/amd64'},
            {'id': 'postgres', 'kind': 'oci_image',
             'image': f'docker.io/library/postgres@{os.environ["POSTGRES_DIGEST"]}',
             'local_image': 'nova-local/postgres:16',
             'license': 'PostgreSQL', 'platform': 'linux/amd64'},
            {'id': 'redis', 'kind': 'oci_image',
             'image': f'docker.io/library/redis@{os.environ["REDIS_DIGEST"]}',
             'local_image': 'nova-local/redis:7',
             'license': 'RSALv2 OR SSPLv1', 'platform': 'linux/amd64'},
          ]

          profils = []
          for palier in paliers:
              t = tier(palier['id'])
              parole, langue = f'speech-{t}', f'language-{t}'
              artifacts.append({
                  'id': parole, 'kind': 'oci_image',
                  'image': f'ghcr.io/mailpro31/nova-quick-lab-speech@{digests[parole]}',
                  'local_image': f'nova-local/speech-{t}:{version}',
                  'license': 'MIT AND Apache-2.0', 'platform': 'linux/amd64'})
              artifacts.append({
                  'id': langue, 'kind': 'oci_image',
                  'image': f'ghcr.io/mailpro31/nova-quick-lab-language@{digests[langue]}',
                  'local_image': f'nova-local/language-{t}:{version}',
                  'license': 'Apache-2.0', 'platform': 'linux/amd64'})
              profils.append({
                  'id': palier['id'],
                  'minimum_ram_gib': palier['minimum_ram_gib'],
                  'minimum_vram_mib': palier['minimum_vram_mib'],
                  'maximum_vram_mib': palier['maximum_vram_mib'],
                  'estimated_disk_gib': palier.get('estimated_disk_gib', 25),
                  'max_concurrent_text': palier['max_concurrent_text'],
                  'max_concurrent_speech': palier['max_concurrent_speech'],
                  'queue_size': palier.get('queue_size', 2),
                  # Le chemin dans l'image ne varie pas d'un palier a l'autre :
                  # c'est le modele cuit dedans qui change.
                  'speech': {'artifact_id': parole,
                             'image': f'nova-local/speech-{t}:{version}',
                             'model_id': f'/models/speech',
                             'model_path': '/models/speech',
                             'compute_type': palier['speech_compute_type']},
                  'language': {'artifact_id': langue,
                               'image': f'nova-local/language-{t}:{version}',
                               'model_id': palier['text_model'],
                               'model_path': '/models/language',
                               'quantization': 'AWQ',
                               'max_model_len': palier['text_max_model_len'],
                               'gpu_memory_utilization': palier['text_gpu_memory_utilization']},
              })

          manifest = {
            'schema_version': 1, 'release_id': f'{channel}-{version}',
            'installer': {
              'version': version, 'minimum_version': '0.1.0',
              'url': f'https://releases.novaspeak.app/server/{channel}/NovaOrganizationServerSetup.exe',
              'sha256': os.environ['INSTALLER_SHA256'],
              'authenticode_signed': False,
            },
            'images': {'server': f'nova-local/server:{version}',
                       'postgres': 'nova-local/postgres:16',
                       'redis': 'nova-local/redis:7'},
            'artifacts': artifacts,
            'provenance': {
              'index_digests': {'nova-server': os.environ['SERVER_INDEX']},
              'note': 'artifacts pin the linux/amd64 manifest digest; the server index digest is the one this release built',
            },
            'profiles': profils,
          }
          chemin = f'release-site/public/server/{channel}/manifest.json'
          with open(chemin, 'w', encoding='utf-8', newline=chr(10)) as sortie:
              json.dump(manifest, sortie, ensure_ascii=False, separators=(',', ':'))
          print(f"{len(profils)} profils, {len(artifacts)} artefacts")
          PY
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/nova-release-signing.pem"
          chmod 600 "$RUNNER_TEMP/nova-release-signing.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/nova-release-signing.pem" -out "$RUNNER_TEMP/manifest.sig.bin" release-site/public/server/${CHANNEL}/manifest.json
          base64 -w0 "$RUNNER_TEMP/manifest.sig.bin" > release-site/public/server/${CHANNEL}/manifest.json.sig
          rm -f "$RUNNER_TEMP/nova-release-signing.pem" "$RUNNER_TEMP/manifest.sig.bin"
          printf '{"status":"ready","release":"%s"}\n' "$VERSION" > release-site/public/index.json
          printf '%s\n' '{"headers":[{"source":"/server/(.*)","headers":[{"key":"Cache-Control","value":"public, max-age=300, must-revalidate"},{"key":"X-Content-Type-Options","value":"nosniff"}]}]}' > release-site/vercel.json
      - name: Re-stage every channel this release does not publish
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # `vercel deploy` publie le contenu de `release-site`, et rien d'autre :
          # le site en ligne est remplace, pas complete. Un dossier qui ne
          # contient que le canal du jour efface donc tous les autres.
          #
          # Une premiere version de cette garde parcourait une liste ecrite en
          # dur. Elle n'a protege que ce dont quelqu'un s'etait souvenu : le
          # 7 septembre 2026, une publication de `quick-lab` a efface le canal
          # `test-channel`, absent de la liste, sans qu'aucune etape n'echoue.
          #
          # Le site porte donc son propre registre. `index.json` enumere les
          # canaux publies ; chaque publication le relit, s'y ajoute, et remet
          # en place tout ce qu'elle ne publie pas. Aucune liste a tenir a jour
          # a la main, donc aucune liste a oublier.
          origine=https://releases.novaspeak.app
          python3 - "$origine" "$CHANNEL" > /tmp/canaux.txt <<'PY'
          import json, sys, urllib.request
          origine, canal = sys.argv[1], sys.argv[2]
          try:
              with urllib.request.urlopen(f"{origine}/index.json", timeout=30) as reponse:
                  index = json.load(reponse)
          except Exception as erreur:            # noqa: BLE001
              # Un site injoignable n'autorise pas a publier a l'aveugle : on ne
              # sait pas ce qu'on effacerait.
              print(f"index.json illisible : {erreur}", file=sys.stderr)
              raise SystemExit(1)
          # Le premier passage precede le registre : le seul canal existant
          # alors est celui que l'installeur pointe depuis toujours.
          canaux = index.get("channels") or ["quick-lab"]
          for autre in canaux:
              if autre != canal:
                  print(autre)
          PY
          preserves=0
          while read -r autre; do
            [ -z "$autre" ] && continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$origine/server/$autre/manifest.json" || echo 000)
            if [ "$code" = "404" ]; then
              echo "canal $autre : absent du site, retire du registre"
              continue
            fi
            if [ "$code" != "200" ]; then
              echo "canal $autre : le site a repondu $code, publication interrompue" >&2
              exit 1
            fi
            echo "canal $autre : preservation"
            mkdir -p "release-site/public/server/$autre"
            for fichier in manifest.json manifest.json.sig NovaOrganizationServerSetup.exe; do
              statut=$(curl -sS -o "release-site/public/server/$autre/$fichier"                        -w '%{http_code}' "$origine/server/$autre/$fichier" || echo 000)
              if [ "$statut" = "404" ]; then
                rm -f "release-site/public/server/$autre/$fichier"
                continue
              fi
              if [ "$statut" != "200" ]; then
                echo "  $fichier : $statut, publication interrompue" >&2
                exit 1
              fi
            done
            preserves=$((preserves + 1))
          done < /tmp/canaux.txt

          # Le registre decrit ce que le site contient reellement apres ce
          # deploiement : les canaux effectivement remis en place, plus celui
          # qu'on publie. Un canal disparu n'y revient pas.
          python3 - "$CHANNEL" "$VERSION" > release-site/public/index.json <<'PY'
          import json, os, sys
          canal, version = sys.argv[1], sys.argv[2]
          racine = "release-site/public/server"
          canaux = sorted({canal} | {
              nom for nom in os.listdir(racine)
              if os.path.exists(os.path.join(racine, nom, "manifest.json"))
          })
          json.dump({"status": "ready", "release": version,
                     "channel": canal, "channels": canaux},
                    sys.stdout, separators=(",", ":"))
          print()
          PY
          echo "canaux preserves : $preserves"
          cat release-site/public/index.json

      - name: Deploy manifest to releases.novaspeak.app
        working-directory: release-site
        env:
          VERCEL_TOKEN: ${{ secrets.NOVA_RELEASE_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.NOVA_RELEASE_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.NOVA_RELEASE_VERCEL_PROJECT_ID }}
        run: npx --yes vercel@48 deploy --prod --yes --token "$VERCEL_TOKEN"
      - uses: actions/upload-artifact@v6
        with:
          name: organization-lab-${{ inputs.version }}-manifest
          path: release-site/public/server/${{ inputs.channel }}/
          retention-days: 90

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the published images against the signed manifest
        run: |
          set -euo pipefail
          # No credentials: this is the client's view of the registry. Every
          # manifest, config and layer is re-hashed and compared with what the
          # signed manifest pins.
          unset GITHUB_TOKEN GH_TOKEN
          python3 tools/organization-lab/verify-release-images.py             https://releases.novaspeak.app/server/${{ inputs.channel }}/manifest.json
